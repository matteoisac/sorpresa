<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>💘 Vuoi essere la mia Valentina?</title>
  <style>
    :root{
      --bg1:#fff0f6;
      --bg2:#ffe4f1;
      --pink:#ff2d8d;
      --pink2:#ff6bb5;
      --text:#2b1b22;
    }
    *{box-sizing:border-box;font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(circle at 20% 20%, var(--bg2), var(--bg1));
      overflow:hidden;
      color:var(--text);
    }
    .card{
      position:relative;
      width:min(860px, 94vw);
      padding:36px 28px 28px;
      border-radius:28px;
      background: rgba(255,255,255,0.78);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      border: 2px solid rgba(255,45,141,0.18);
      text-align:center;
    }
    h1{
      margin:0 0 10px;
      font-size: clamp(28px, 4vw, 44px);
      line-height:1.1;
    }
    p{
      margin:0 0 26px;
      font-size: clamp(16px, 2.2vw, 20px);
      opacity:.9;
    }
    .arena{
      position:relative;
      height: 260px;
      border-radius:22px;
      background: linear-gradient(180deg, rgba(255,45,141,0.08), rgba(255,45,141,0.03));
      border: 1px dashed rgba(255,45,141,0.35);
      overflow:hidden;
      touch-action:none;
      transition: height .35s ease;
    }
    .btn{
      border:none;
      cursor:pointer;
      user-select:none;
      border-radius:999px;
      padding:14px 22px;
      font-weight:800;
      transition: transform .12s ease, box-shadow .12s ease, opacity .2s ease;
      position:absolute;
      display:inline-flex;
      align-items:center;
      gap:10px;
      white-space:nowrap;
      -webkit-tap-highlight-color: transparent;
      z-index: 3;
    }
    .btn:active{ transform: scale(0.98); }

    /* SÌ gigante rosa */
    #yes{
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);
      font-size: clamp(22px, 3.2vw, 34px);
      padding: 18px 34px;
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      color:white;
      box-shadow: 0 18px 40px rgba(255,45,141,0.35);
    }
    #yes:hover{ transform: translate(-50%, -50%) scale(1.05); }

    /* NO che scappa (non cliccabile) */
    #no{
      left: 62%;
      top: 22%;
      font-size: 18px;
      background: rgba(255,255,255,0.92);
      color: var(--text);
      border: 2px solid rgba(255,45,141,0.35);
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      cursor: pointer;
      pointer-events: auto; /* ora cliccabile: avvia la sequenza */
    }

    .msg{
      margin-top:18px;
      font-size: 18px;
      font-weight: 700;
      color: var(--pink);
      min-height: 28px;
    }

    /* Foto che appare dopo il SÌ */
    .photoWrap{
      position:absolute;
      inset: 10px;
      border-radius: 18px;
      overflow:hidden;
      opacity: 0;
      transform: scale(0.985);
      transition: opacity .35s ease, transform .35s ease;
      z-index: 2;
      pointer-events:none;
      box-shadow: 0 18px 40px rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.65);
    }
    .photoWrap.show{
      opacity: 1;
      transform: scale(1);
    }
    .photoWrap img{
      width:100%;
      height:100%;
      object-fit: contain; /* mostra tutta la foto (senza tagli) */
      display:block;
      background: rgba(255,255,255,0.65);
    }
    .photoOverlay{
      position:absolute;
      inset:0;
      background: radial-gradient(circle at 30% 20%, rgba(255,45,141,0.18), rgba(0,0,0,0.06));
      pointer-events:none;
    }

    /* cuoricini decorativi */
    .heart{
      position:absolute;
      opacity:.25;
      filter: blur(.2px);
      animation: float 6s ease-in-out infinite;
      pointer-events:none;
      font-size: 28px;
    }
    @keyframes float{
      0%,100%{ transform: translateY(0) rotate(0deg); }
      50%{ transform: translateY(-18px) rotate(8deg); }
    }
  
    /* Conferme popup + schermata finale */
    .modalOverlay{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,0.45);
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 9999;
      padding: 18px;
    }
    .modalOverlay.show{ display:flex; }

    .modal{
      width: min(520px, 92vw);
      border-radius: 22px;
      background: rgba(255,255,255,0.92);
      border: 2px solid rgba(255,45,141,0.22);
      box-shadow: 0 30px 90px rgba(0,0,0,0.25);
      padding: 22px 18px 18px;
      text-align:center;
      backdrop-filter: blur(10px);
    }
    .modal h2{
      margin: 4px 0 14px;
      font-size: clamp(20px, 2.7vw, 28px);
      line-height: 1.2;
    }
    .modal .row{
      display:flex;
      gap: 12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top: 12px;
    }
    .modalBtn{
      border:none;
      cursor:pointer;
      user-select:none;
      border-radius:999px;
      padding: 12px 18px;
      font-weight: 900;
      font-size: 18px;
      transition: transform .12s ease, box-shadow .12s ease, opacity .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .modalBtn:active{ transform: scale(0.98); }
    .modalBtn.no{
      background: rgba(255,255,255,0.92);
      color: var(--text);
      border: 2px solid rgba(255,45,141,0.35);
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    }
    .modalBtn.yes{
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      color:white;
      box-shadow: 0 18px 40px rgba(255,45,141,0.35);
    }

    .finalScreen{
      position:absolute;
      inset: 10px;
      border-radius: 18px;
      background: rgba(255,255,255,0.76);
      box-shadow: 0 18px 40px rgba(0,0,0,0.12);
      border: 1px dashed rgba(255,45,141,0.35);
      display:none;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap: 18px;
      z-index: 4;
      padding: 16px;
      text-align:center;
    }
    .finalScreen.show{ display:flex; }

    .finalScreen .finalTitle{
      font-size: clamp(20px, 2.6vw, 28px);
      font-weight: 900;
      color: var(--text);
    }
    .finalYesRow{
      display:flex;
      gap: 14px;
      flex-wrap:wrap;
      justify-content:center;
    }
    .finalYes{
      border:none;
      cursor:pointer;
      user-select:none;
      border-radius:999px;
      padding: 16px 26px;
      font-weight: 950;
      font-size: clamp(20px, 3vw, 30px);
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      color:white;
      box-shadow: 0 18px 40px rgba(255,45,141,0.35);
      transition: transform .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .finalYes:active{ transform: scale(0.98); }

  </style>
</head>

    <div class="heart" style="bottom:18px;left:30px;animation-delay:2s;">💕</div>
    <div class="heart" style="bottom:22px;right:26px;animation-delay:3s;">💗</div>

  <div class="modalOverlay" id="confirmModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Sei proprio sicura?</h2>
      <div class="row">
        <button class="modalBtn no" id="modalNo">No</button>
        <button class="modalBtn yes" id="modalYes">Sì</button>
      </div>
    </div>
  </div>

  <script>
    const arena = document.getElementById('arena');
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const msg = document.getElementById('msg');
    const photoWrap = document.getElementById('photoWrap');
    const photo = document.getElementById('photo');

    // Compatibilità iPhone / Safari (touch)
    const supportsPointer = ('PointerEvent' in window);

    function getClientXY(e){
      // Supporta PointerEvent, MouseEvent e TouchEvent
      if (e && e.touches && e.touches[0]){
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      if (e && e.changedTouches && e.changedTouches[0]){
        return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }


    // Parametri fuga (ancora più difficile arrivare vicino agli angoli)
    const panicRadius = 190;
    const extraPush   = 220;

    function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

    function placeNo(x, y){
      const r = arena.getBoundingClientRect();
      const bw = noBtn.offsetWidth;
      const bh = noBtn.offsetHeight;

      const px = clamp(x, 10, r.width - bw - 10);
      const py = clamp(y, 10, r.height - bh - 10);

      noBtn.style.left = px + 'px';
      noBtn.style.top  = py + 'px';
    }

    function runAwayFrom(clientX, clientY){
      if (confirmActive) return;
      const a = arena.getBoundingClientRect();
      const n = noBtn.getBoundingClientRect();

      const mx = clientX - a.left;
      const my = clientY - a.top;

      const nx = (n.left - a.left) + n.width / 2;
      const ny = (n.top  - a.top)  + n.height / 2;

      let dx = mx - nx;
      let dy = my - ny;
      if (dx === 0 && dy === 0) dx = 1;

      const dist = Math.hypot(dx, dy);
      const push = Math.max(0, panicRadius - dist) + extraPush;
      const angle = Math.atan2(dy, dx);

      const rx = Math.cos(angle) * (-push) + (Math.random()*160 - 80);
      const ry = Math.sin(angle) * (-push) + (Math.random()*160 - 80);

      placeNo((n.left - a.left) + rx, (n.top - a.top) + ry);
    }

    function keepNoAway(e){
      // anche se il NO è in un angolo, il dito/mouse che ci passa vicino lo farà scappare
      const p = getClientXY(e);
      runAwayFrom(p.x, p.y);
    }

    window.addEventListener('load', () => {
      placeNo(arena.clientWidth * 0.62, arena.clientHeight * 0.22);
    });

    function handleMove(e){
      if (confirmActive) return;
      const a = arena.getBoundingClientRect();
      const n = noBtn.getBoundingClientRect();
      const p = getClientXY(e);

      const mx = p.x - a.left;
      const my = p.y - a.top;

      const nx = (n.left - a.left) + n.width / 2;
      const ny = (n.top  - a.top) + n.height / 2;

      const dist = Math.hypot(mx - nx, my - ny);
      if (dist < panicRadius) runAwayFrom(p.x, p.y);
    }

    // Desktop: pointer/mouse. iPhone: pointermove se supportato, altrimenti touchmove.
    if (supportsPointer){
      arena.addEventListener('pointermove', handleMove, { passive: true });
    } else {
      arena.addEventListener('mousemove', handleMove, { passive: true });
      arena.addEventListener('touchmove', handleMove, { passive: true });
    }

    // s
    // Se clicchi nell'arena vicino al NO, lui scappa comunque
    function handleDownNearNo(e){
      if (confirmActive) return;
      const a = arena.getBoundingClientRect();
      const n = noBtn.getBoundingClientRect();
      const p = getClientXY(e);

      const mx = p.x - a.left;
      const my = p.y - a.top;

      const nx = (n.left - a.left) + n.width / 2;
      const ny = (n.top  - a.top) + n.height / 2;

      const dist = Math.hypot(mx - nx, my - ny);
      if (dist < panicRadius + 40) keepNoAway(e);
    }

    if (supportsPointer){
      arena.addEventListener('pointerdown', handleDownNearNo);
    } else {
      arena.addEventListener('touchstart', handleDownNearNo, { passive: true });
      arena.addEventListener('mousedown', handleDownNearNo);
    }

    // Adatta l'altezza del riquadro per mostrare la foto intera (proporzioni originali)
    function fitArenaToImage(){
      const w = arena.clientWidth - 20; // tenendo conto di inset:10px
      const nw = photo.naturalWidth || 1;
      const nh = photo.naturalHeight || 1;
      const h = (nh / nw) * w;

      // limiti per non uscire dallo schermo
      const maxH = Math.floor(window.innerHeight * 0.68);
      const minH = 320;
      const target = Math.max(minH, Math.min(maxH, Math.floor(h + 20)));
      arena.style.height = target + "px";
    }

    // ricalcola se cambia la finestra
    window.addEventListener('resize', () => {
      if (photoWrap.classList.contains('show')) fitArenaToImage();
    });

    
    // Sequenza conferme 
    const modal = document.getElementById('confirmModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalYes = document.getElementById('modalYes');
    const modalNo = document.getElementById('modalNo');

    const finalScreen = document.getElementById('finalScreen');
    const finalYes1 = document.getElementById('finalYes1');
    const finalYes2 = document.getElementById('finalYes2');

    const initialArenaHeight = arena.style.height || ""; // (vuoto = usa CSS)

    let confirmActive = false;

    let confirmStep = 0;
    const confirmTexts = [
      "Sei proprio sicura?",
      "Ma sicura sicura?",
      "Ma sicurissimissima?"
    ];

    function hideModal(){
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden','true');
      confirmActive = false;
    }
    function showModal(){
      confirmActive = true;
      modal.classList.add('show');
      modal.setAttribute('aria-hidden','false');
      modalTitle.textContent = confirmTexts[confirmStep] || confirmTexts[0];
    }

    function resetToFirstScreen(){
      confirmActive = false;
      confirmStep = 0;
      hideModal();

      finalScreen.classList.remove('show');
      finalScreen.setAttribute('aria-hidden','true');

      // ripristina UI iniziale
      msg.textContent = "";
      photoWrap.classList.remove('show');

      yesBtn.style.display = "";
      yesBtn.style.opacity = "1";
      yesBtn.style.left = "50%";
      yesBtn.style.top = "55%";
      yesBtn.style.transform = "translate(-50%, -50%)";

      noBtn.style.opacity = "1";

      // ripristina altezza arena
      arena.style.height = initialArenaHeight;
      placeNo(arena.clientWidth * 0.62, arena.clientHeight * 0.22);
    }

    function showFinalScreen(){
      confirmActive = true;
      hideModal();

      // nascondi i bottoni originali
      yesBtn.style.display = "none";
      noBtn.style.opacity = "0";

      finalScreen.classList.add('show');
      finalScreen.setAttribute('aria-hidden','false');

      msg.textContent = "Ultima possibilità 😏";
    }

    function showPhotoFinal(){
      confirmActive = false;
      finalScreen.classList.remove('show');
      finalScreen.setAttribute('aria-hidden','true');

      // sicurezza: se per qualche motivo il “SÌ” è ancora visibile, nascondilo
      yesBtn.style.display = "none";

      msg.textContent = "YEEEE! 💞 Allora è un SÌ! 🥰";
      photoWrap.classList.add('show');

      // espandi l'arena per vedere la foto intera
      if (photo.complete) fitArenaToImage();
      else photo.addEventListener('load', fitArenaToImage, { once:true });
    }

    // click sul SÌ iniziale → mostra subito la foto finale
    yesBtn.addEventListener('click', () => {
      if (photoWrap.classList.contains('show')) return;
      showPhotoFinal();

      // nascondi anche il bottone “SÌ” (prima restava sopra la foto)
      yesBtn.style.display = "none";

      // “NO” sparisce
      noBtn.style.opacity = "0";
    });

    // click sul NO → avvia la sequenza popup (prima che  scappi)
    function openNoModal(e){
      if (photoWrap.classList.contains('show')) return; // già in finale
      // Su iPhone/Safari, prevengo il "ghost click" e la selezione testo.
      e.preventDefault();
      e.stopPropagation();
      confirmStep = 0;
      showModal();
    }

    if (supportsPointer){
      noBtn.addEventListener('pointerdown', openNoModal);
    } else {
      noBtn.addEventListener('touchstart', openNoModal, { passive: false });
      noBtn.addEventListener('mousedown', openNoModal);
      noBtn.addEventListener('click', openNoModal);
    }

    // “No” nei popup → torna alla prima schermata
    modalNo.addEventListener('click', () => {
      resetToFirstScreen();
    });

    // “Sì” nei popup → avanti di step o schermata finale
    modalYes.addEventListener('click', () => {
      confirmStep += 1;
      if (confirmStep < confirmTexts.length){
        modalTitle.textContent = confirmTexts[confirmStep];
      } else {
        showFinalScreen();
      }
    });

    // I due “SÌ” finali → foto finale
    finalYes1.addEventListener('click', showPhotoFinal);
    finalYes2.addEventListener('click', showPhotoFinal);

    // click fuori dal popup = consideralo “No” (torna indietro)
    modal.addEventListener('pointerdown', (e) => {
      if (e.target === modal) resetToFirstScreen();
    });
</script>
</body>
</html>
